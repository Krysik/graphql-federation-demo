services:
  movies:
    build:
      context: ./movies
      dockerfile: Dockerfile
    environment:
      - PORT=5001
    ports:
      - "5001:5001"

  reviews:
    build:
      context: ./reviews
      dockerfile: Dockerfile
    environment:
      - PORT=5002
    ports:
      - "5002:5002"

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      - PORT=5000
    ports:
      - "5000:5000"
